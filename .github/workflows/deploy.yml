name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect now-playing POST and play_history
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Check play_history table in backend DB ==="
            sqlite3 /root/novastream-backend/radio.db ".tables"

            echo "=== Check play_history schema ==="
            sqlite3 /root/novastream-backend/radio.db ".schema play_history" 2>&1 || echo "no play_history table"

            echo "=== Recent play_history entries ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT * FROM play_history ORDER BY played_at DESC LIMIT 5;" 2>&1 || echo "no play_history table"

            echo "=== now-playing route in novastream dist ==="
            grep -n "now-playing\|now_playing\|play_history" /root/novastream/dist/index.js | head -20

            echo "=== Test now-playing POST ==="
            curl -s -X POST -H "Content-Type: application/json" \
              -d '{"filepath":"/root/novastream/storage/music/250553_1778099320620.mp3"}' \
              http://localhost:3001/api/stream/now-playing 2>&1

            echo "=== Check now after POST ==="
            curl -s http://localhost:3001/api/stream/now 2>&1

            echo "=== novastream backend recent logs ==="
            pm2 logs novastream --lines 20 --nostream 2>&1 | tail -30
