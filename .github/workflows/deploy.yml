name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  check-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check why stream stopped
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== LIQUIDSOAP LOGS (last 50 lines) ==="
            journalctl -u liquidsoap --no-pager -n 50 2>/dev/null || true

            echo ""
            echo "=== LIQUIDSOAP SCRIPT ==="
            cat /root/novastream.liq 2>/dev/null || find /root -name "*.liq" -exec cat {} \; 2>/dev/null | head -80

            echo ""
            echo "=== NEXT-TRACK API NOW ==="
            curl -s http://localhost:3006/api/stream/next-track | head -c 300
            echo ""

            echo ""
            echo "=== STREAM STATUS ==="
            curl -s http://localhost:8000/stream --max-time 3 | wc -c
            echo "bytes in 3s"

            echo ""
            echo "=== NOVASTREAM-ADMIN ERRORS (last 20) ==="
            pm2 logs novastream-admin --lines 20 --nostream 2>/dev/null | tail -25

            echo "DONE"
