name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get exact context around require line and stream routes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            BUNDLE="/root/novastream-admin/dist/index.js"
            echo "=== LINES 1360-1400 ==="
            sed -n '1360,1400p' "$BUNDLE"
            echo "=== STREAM ROUTES (grep) ==="
            grep -n "stream/now\|stream/next\|now_playing\|recently_played\|play_history" "$BUNDLE" | head -30
            echo "=== LINES 1-25 (imports/setup) ==="
            sed -n '1,25p' "$BUNDLE"
