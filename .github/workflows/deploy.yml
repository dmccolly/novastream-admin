name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload dist to server tmp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: dist/index.js
          target: /tmp/novastream_deploy/

      - name: Deploy dist and fix everything
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Copy dist to both apps ==="
            cp /tmp/novastream_deploy/dist/index.js /root/novastream/dist/index.js
            cp /tmp/novastream_deploy/dist/index.js /root/novastream-admin/dist/index.js

            echo "=== Verify WMA fix ==="
            grep -c "NOT LIKE" /root/novastream/dist/index.js

            echo "=== Restart novastream ==="
            pm2 restart novastream
            sleep 3

            echo "=== Restart novastream-admin ==="
            pm2 restart novastream-admin
            sleep 3

            echo "=== PM2 status ==="
            pm2 list | grep -E "novastream|online|stopped"

            echo "=== Test next-track returns MP3 ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/next-track | grep -o '"filepath":"[^"]*"' | head -1

            echo "=== Trigger WMA conversion on port 3006 ==="
            curl -s -X POST --max-time 10 http://localhost:3006/api/admin/convert-wma

            echo "=== Restart Liquidsoap ==="
            pkill -f liquidsoap || true
            sleep 3
            ps aux | grep liquidsoap | grep -v grep | head -2

            echo "=== Wait for watchdog to restart Liquidsoap ==="
            sleep 15
            ps aux | grep liquidsoap | grep -v grep | head -2

            echo "=== play_history recent ==="
            sqlite3 /root/novastream/radio.db "SELECT title, artist, played_at FROM play_history ORDER BY played_at DESC LIMIT 5;"

            echo "=== Icecast title ==="
            curl -s --max-time 5 http://localhost:8000/status-json.xsl | grep -o '"title":"[^"]*"' | head -1
