name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  fix-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assign categories to tracks and verify stream
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120s
          script: |
            DB=/root/novastream-admin/radio.db

            echo "=== ASSIGNING CATEGORY 1 (Music) TO ALL READY TRACKS WITH NULL CATEGORY ==="
            sqlite3 $DB "UPDATE tracks SET category_id=1 WHERE status='ready' AND (category_id IS NULL OR category_id='');"
            echo "Updated: $(sqlite3 $DB "SELECT changes();")"

            echo ""
            echo "=== VERIFY: Ready tracks with category 1 ==="
            sqlite3 $DB "SELECT COUNT(*) FROM tracks WHERE status='ready' AND category_id=1 AND filepath IS NOT NULL;"

            echo ""
            echo "=== TESTING NEXT-TRACK API ==="
            sleep 1
            RESPONSE=$(curl -s http://localhost:3006/api/stream/next-track)
            echo "Response: $RESPONSE" | head -c 500
            echo ""

            echo ""
            echo "=== STREAM BYTES FROM ICECAST ==="
            BYTES=$(curl -s http://localhost:8000/stream --max-time 4 | wc -c)
            echo "Bytes in 4s: $BYTES"

            echo "DONE"
