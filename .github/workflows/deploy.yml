name: Debug Port 3001

on:
  push:
    branches: [main]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check port 3001 and get_next_track.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 40s
          script: |
            echo "=== Port 3001 check ==="
            curl -sv --max-time 5 http://localhost:3001/api/stream/next-track 2>&1 | tail -20

            echo "=== PM2 status ==="
            pm2 list --no-color 2>&1 | grep -E "name|novastream"

            echo "=== get_next_track.sh output ==="
            chmod +x /root/get_next_track.sh
            timeout 8 /root/get_next_track.sh 2>&1
            echo "Exit: $?"

            echo "=== Liquidsoap log tail ==="
            tail -15 /var/log/liquidsoap.log
