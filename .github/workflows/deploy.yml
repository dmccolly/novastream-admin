name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          command_timeout: 180s
          script: |
            set -e
            cd /root/novastream-admin
            git fetch origin
            git reset --hard origin/main
            git clean -fd --exclude=radio.db --exclude=.env --exclude=storage --exclude=node_modules
            npm install --legacy-peer-deps
            npm run build:all
            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save
            sleep 3
            echo "=== PROCESS STATUS ==="
            pm2 list
            echo "=== NOVASTREAM-ADMIN LOGS ==="
            pm2 logs novastream-admin --lines 30 --nostream 2>&1 || true
            echo "Deploy complete"
