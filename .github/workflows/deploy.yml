name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            # Restore novastream on port 3006 first
            cd /root/novastream
            git checkout dist/index.js 2>/dev/null || true
            pm2 start dist/index.js --name novastream 2>/dev/null || pm2 restart novastream
            sleep 2
            curl -sf http://localhost:3006/api/health && echo "port 3006 OK" || echo "port 3006 FAILED"

            # Now build and restart novastream-admin (stays on port 3001 internal)
            cd /root/novastream-admin
            git fetch origin main
            git reset --hard origin/main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all
            pm2 restart novastream-admin 2>/dev/null || pm2 start dist/index.js --name novastream-admin

            pm2 save --force
            echo "=== PM2 ==="
            pm2 list
          command_timeout: 10m

      - name: Update player HTML
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            for WEBROOT in /var/www/html /var/www/streamofdan.com/html /var/www/streamofdan/html /usr/share/nginx/html; do
              if [ -f "$WEBROOT/index.html" ]; then
                cp /root/novastream-admin/player/index.html "$WEBROOT/index.html"
                echo "Updated player at $WEBROOT/index.html"
                break
              fi
            done
          command_timeout: 5m
