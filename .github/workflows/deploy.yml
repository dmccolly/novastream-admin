name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore all server files to pre-today state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            echo "=== What backups exist? ==="
            ls -la /root/novastream-admin/dist/index.js.bak* 2>/dev/null || echo "no bak files"
            ls -la /root/novastream/dist/index.js.bak* 2>/dev/null || echo "no bak files in novastream"
            ls -la /var/www/html/index.html.bak* 2>/dev/null || echo "no bak files in www"

            echo ""
            echo "=== Git log on novastream-admin (server) ==="
            cd /root/novastream-admin && git log --oneline -10 2>/dev/null || echo "not a git repo"

            echo ""
            echo "=== Git log on novastream (server) ==="
            cd /root/novastream && git log --oneline -10 2>/dev/null || echo "not a git repo"

            echo ""
            echo "=== Files modified today on server ==="
            find /root/novastream-admin/dist -newer /root/novastream-admin/dist/index.js -name "*.js" 2>/dev/null | head -20
            find /root/novastream/dist -newer /root/novastream/dist/index.js -name "*.js" 2>/dev/null | head -20

            echo ""
            echo "=== Check modification times of key files ==="
            stat /root/novastream-admin/dist/index.js 2>/dev/null | grep Modify
            stat /root/novastream/dist/index.js 2>/dev/null | grep Modify
            stat /var/www/html/index.html 2>/dev/null | grep Modify

            echo "DONE"
          command_timeout: 30s
