name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  inspect-stream-route:
    runs-on: ubuntu-latest
    steps:
      - name: Show exact stream route code in novastream dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Backup exists? ==="
            ls -la /root/novastream/dist/index.js.bak 2>/dev/null && echo "YES" || echo "NO"

            echo "=== Current dist/index.js size ==="
            ls -la /root/novastream/dist/index.js

            echo "=== Extract stream route: 200 chars around 'Audio file not found' ==="
            node -e "
              var fs = require('fs');
              var code = fs.readFileSync('/root/novastream/dist/index.js', 'utf8');
              var idx = code.indexOf('Audio file not found on server');
              if (idx < 0) { console.log('NOT FOUND'); process.exit(0); }
              console.log('FOUND at index:', idx);
              console.log('--- 400 chars before ---');
              console.log(JSON.stringify(code.slice(idx-400, idx)));
              console.log('--- 200 chars after ---');
              console.log(JSON.stringify(code.slice(idx, idx+200)));
            "

            echo "=== Extract preview route: 200 chars around 'returning local URL' ==="
            node -e "
              var fs = require('fs');
              var code = fs.readFileSync('/root/novastream/dist/index.js', 'utf8');
              var idx = code.indexOf('returning local URL');
              if (idx < 0) { console.log('NOT FOUND'); process.exit(0); }
              console.log('FOUND at index:', idx);
              console.log('--- 300 chars before ---');
              console.log(JSON.stringify(code.slice(idx-300, idx)));
              console.log('--- 100 chars after ---');
              console.log(JSON.stringify(code.slice(idx, idx+100)));
            "
          command_timeout: 1m
