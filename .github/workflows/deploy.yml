name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  fix-next-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get broken code and fix it
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== FIND THE BROKEN require() IN next-track HANDLER ==="
            # Get the lines around line 1490 where the error occurs
            sed -n '1480,1510p' /root/novastream-admin/dist/index.js

            echo ""
            echo "=== FULL next-track HANDLER CONTEXT ==="
            grep -n "next-track\|next_track\|nextTrack\|require(" /root/novastream-admin/dist/index.js | head -30
