name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PM2 logs and test now-playing with real track
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== PM2 LOGS (last 20 lines novastream-admin) ==="
            pm2 logs novastream-admin --nostream --lines 20 2>/dev/null

            echo "=== TEST NOW-PLAYING WITH REAL FILEPATH ==="
            REAL_FP=$(curl -s http://localhost:3006/api/stream/next-track 2>/dev/null | jq -r '.track.filepath // empty')
            echo "Real filepath: $REAL_FP"
            if [ -n "$REAL_FP" ]; then
              RESP=$(curl -s -X POST -H "Content-Type: application/json" \
                -d "{\"filepath\":\"$REAL_FP\"}" \
                http://localhost:3006/api/stream/now-playing 2>/dev/null)
              echo "now-playing POST response: $RESP"
            fi

            echo "=== NOW API AFTER POST ==="
            sleep 1
            curl -s http://localhost:3006/api/stream/now 2>/dev/null

            echo "=== LIQUIDSOAP LOG (last 20) ==="
            pm2 logs liquidsoap --nostream --lines 20 2>/dev/null || journalctl -u liquidsoap --lines 20 --no-pager 2>/dev/null || echo "No liquidsoap service found"
