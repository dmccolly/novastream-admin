name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  inspect-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Show exact backup stream route code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            node << 'NODEEOF'
            var fs = require('fs');
            var code = fs.readFileSync('/root/novastream/dist/index.js.bak', 'utf8');
            var idx = code.indexOf('Audio file not found on server');
            if (idx < 0) { console.log('NOT FOUND in backup'); process.exit(0); }
            console.log('FOUND at index:', idx);
            console.log('=== 500 chars before ===');
            console.log(JSON.stringify(code.slice(idx-500, idx)));
            console.log('=== 300 chars after ===');
            console.log(JSON.stringify(code.slice(idx, idx+300)));
            NODEEOF
          command_timeout: 1m
