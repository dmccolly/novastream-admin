name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy player and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            cat > /var/www/html/index.html << 'HTMLEOF'
            PLACEHOLDER
            HTMLEOF
            echo "Player deployed: $(wc -c < /var/www/html/index.html) bytes"
            curl -s http://localhost:8000/stream --max-time 3 | wc -c | xargs -I{} echo "Stream bytes in 3s: {}"
            echo "DONE"

      - name: Upload player file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: player/index.html
          target: /var/www/html/
          strip_components: 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            SIZE=$(wc -c < /var/www/html/index.html)
            echo "Player file size: $SIZE bytes"
            grep -c "borah" /var/www/html/index.html && echo "PASSWORD GATE: OK" || echo "PASSWORD GATE: MISSING"
            grep -c "recentList" /var/www/html/index.html && echo "RECENTLY PLAYED: OK" || echo "RECENTLY PLAYED: MISSING"
            grep -c "nowTitle" /var/www/html/index.html && echo "NOW PLAYING: OK" || echo "NOW PLAYING: MISSING"
            BYTES=$(curl -s http://localhost:8000/stream --max-time 3 | wc -c)
            echo "Stream bytes in 3s: $BYTES"
            echo "DONE"
