name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload fixed scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "novastream.liq,get_next_track.sh"
          target: /root/
          strip_components: 0

      - name: Restart Liquidsoap with fixed scripts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 20s
          script: |
            chmod +x /root/get_next_track.sh

            echo "=== Test get_next_track.sh ==="
            /root/get_next_track.sh

            echo "=== Verify delimiter in liq script ==="
            grep "separator" /root/novastream.liq

            echo "=== Write detached restart ==="
            cat > /tmp/restart_liq5.sh << 'SCRIPT'
            #!/bin/bash
            pkill -f liquidsoap_watchdog 2>/dev/null
            pkill -9 -f liquidsoap 2>/dev/null
            sleep 3
            nohup /usr/bin/liquidsoap /root/novastream.liq >> /var/log/liquidsoap.log 2>&1 &
            LIQ_PID=$!
            sleep 10
            nohup bash /root/liquidsoap_watchdog.sh >> /var/log/liquidsoap_watchdog.log 2>&1 &
            echo "restart5 done at $(date), liq PID=$LIQ_PID" > /tmp/liq_restart5_status.txt
            SCRIPT
            chmod +x /tmp/restart_liq5.sh
            setsid nohup bash /tmp/restart_liq5.sh > /tmp/restart_liq5.log 2>&1 &
            echo "Restart launched"

      - name: Verify audio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 35s
          script: |
            sleep 25

            echo "=== Restart status ==="
            cat /tmp/liq_restart5_status.txt 2>/dev/null || echo "pending"

            echo "=== Liquidsoap log last 10 ==="
            tail -10 /var/log/liquidsoap.log

            echo "=== Icecast mount ==="
            curl -s --max-time 3 http://localhost:8000/status-json.xsl | grep -o '"mount":"[^"]*"' || echo "no mount"

            echo "=== Stream bytes ==="
            curl -s --max-time 3 http://localhost:8000/stream | head -c 8 | xxd
