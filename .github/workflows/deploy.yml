name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  patch-novastream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create scripts dir on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: mkdir -p /root/novastream-admin/scripts
          command_timeout: 30s

      - name: Upload Python patch script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/patch-wma.py"
          target: "/root/novastream-admin/"

      - name: Run patch and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Running Python patch ==="
            python3 /root/novastream-admin/scripts/patch-wma.py

            echo "=== Restarting novastream ==="
            pm2 restart novastream
            sleep 4

            echo "=== Health ==="
            curl -sf http://localhost:3001/api/health && echo " OK" || echo " FAIL"

            echo "=== Stream test 185103 (WMA path, MP3 on disk - should work) ==="
            curl -s http://localhost:3001/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd

            echo "=== Stream test 212504 (DRM WMA - should return 404 gracefully) ==="
            curl -s http://localhost:3001/api/tracks/212504/stream --max-time 8

            echo "=== Public URL test 185103 ==="
            curl -s https://api.danielmccolly.com/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd
          command_timeout: 2m
