name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Liquidsoap logs and next-track
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Liquidsoap stdout (last 50 lines) ==="
            journalctl -u liquidsoap -n 50 2>/dev/null || \
            cat /tmp/liquidsoap.log 2>/dev/null | tail -50 || \
            ps aux | grep liquidsoap | grep -v grep | awk '{print $1}' | xargs -I{} cat /proc/{}/fd/1 2>/dev/null | tail -50 || \
            echo "No liquidsoap log found"

            echo "=== Check liquidsoap watchdog ==="
            cat /root/liquidsoap_watchdog.sh 2>/dev/null | head -30

            echo "=== Check next-track endpoint ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/next-track | python3 -c "
import json,sys
try:
    d=json.load(sys.stdin)
    t=d.get('track',{})
    print('track:', t.get('title','?'), '-', t.get('artist','?'))
    print('filepath:', t.get('filepath','?'))
    print('cue_in:', t.get('cue_in','?'), 'cue_out:', t.get('cue_out','?'))
    print('segue:', t.get('segue_duration','?'))
except Exception as e:
    print('Error:', e)
    import sys; print(sys.stdin.read()[:200])
" 2>&1

            echo "=== Recent play_history ==="
            sqlite3 /root/novastream/radio.db "SELECT id, title, artist, played_at FROM play_history ORDER BY played_at DESC LIMIT 5;"

            echo "=== Icecast currently playing ==="
            curl -s --max-time 5 http://localhost:8000/status-json.xsl | python3 -c "
import json,sys
try:
    d=json.load(sys.stdin)
    src = d.get('icestats',{}).get('source',{})
    if isinstance(src, list): src = src[0]
    print('song:', src.get('title','?'), '-', src.get('artist','?'))
except Exception as e:
    print('Error:', e)
" 2>&1
