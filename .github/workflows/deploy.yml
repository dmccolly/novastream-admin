name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read nginx config files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== danielmccolly config ==="
            cat /etc/nginx/sites-enabled/danielmccolly
            echo "=== streamofdan config ==="
            cat /etc/nginx/sites-enabled/streamofdan
            echo "=== novastream config ==="
            cat /etc/nginx/sites-enabled/novastream
