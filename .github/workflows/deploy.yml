name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          command_timeout: 180s
          script: |
            set -e
            cd /root/novastream-admin
            git fetch origin
            git reset --hard origin/main
            git clean -fd --exclude=radio.db --exclude=.env --exclude=storage --exclude=node_modules
            npm install --legacy-peer-deps
            npm run build:all

            # Deploy built artifacts to the running app
            cp dist/index.js /root/novastream/dist/index.js
            rsync -a --delete dist/public/ /root/novastream/dist/public/

            # Install any new runtime deps in the running app
            cd /root/novastream
            npm install dropbox cors dotenv --save --legacy-peer-deps 2>&1 | tail -3

            # Restart the live app
            pm2 restart novastream
            sleep 3
            pm2 list
            echo "Deploy complete"
