name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fix nginx and restore port 3006
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== All listening ports ==="
            ss -tlnp
            echo "=== Nginx status ==="
            systemctl status nginx 2>/dev/null | head -10 || echo "nginx not found"
            echo "=== Nginx config ==="
            cat /etc/nginx/sites-enabled/* 2>/dev/null || cat /etc/nginx/nginx.conf 2>/dev/null | grep -A5 "3006\|3001\|proxy_pass" | head -30
            echo "=== Restart nginx ==="
            systemctl restart nginx 2>/dev/null && echo "nginx restarted OK" || echo "nginx restart failed"
            sleep 2
            echo "=== Port 3006 check ==="
            curl -sf http://localhost:3006/api/health && echo "3006 OK" || echo "3006 FAILED"
          command_timeout: 5m
