name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Liquidsoap script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== LIQUIDSOAP SCRIPT ==="
            find /root /etc /home -name "*.liq" 2>/dev/null | head -5
            LIQ=$(find /root /etc /home -name "*.liq" 2>/dev/null | head -1)
            if [ -n "$LIQ" ]; then
              echo "FILE: $LIQ"
              cat "$LIQ"
            fi
            echo "=== PM2 LIQUIDSOAP LOGS (last 50) ==="
            pm2 logs --nostream --lines 50 2>/dev/null | grep -i "liq\|liquid\|now.play\|segue\|cue\|callback\|track" | tail -30
            echo "=== NOW PLAYING API ==="
            curl -s http://localhost:3006/api/stream/now 2>/dev/null
            echo ""
            echo "=== NEXT TRACK API ==="
            curl -s http://localhost:3006/api/stream/next-track 2>/dev/null
            echo ""
