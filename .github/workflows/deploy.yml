name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  fix-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix SQLite schema and restart novastream-admin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Find the SQLite database ==="
            find /root/novastream-admin -name "*.db" -o -name "*.sqlite" 2>/dev/null | head -10

            echo ""
            echo "=== Check clock_items table schema ==="
            DB=$(find /root/novastream-admin -name "*.db" -o -name "*.sqlite" 2>/dev/null | head -1)
            echo "DB path: $DB"
            sqlite3 "$DB" ".schema clock_items" 2>/dev/null || echo "No clock_items table or no DB"

            echo ""
            echo "=== Check what the code expects (slot_type in initDb) ==="
            grep -n "slot_type\|clock_items" /root/novastream-admin/dist/index.js 2>/dev/null | head -30

            echo ""
            echo "=== Add missing slot_type column if needed ==="
            if sqlite3 "$DB" "SELECT slot_type FROM clock_items LIMIT 1;" 2>&1 | grep -q "no such column"; then
              echo "Adding slot_type column..."
              sqlite3 "$DB" "ALTER TABLE clock_items ADD COLUMN slot_type TEXT DEFAULT 'track';" && echo "Column added OK" || echo "Failed to add column"
            else
              echo "slot_type column already exists or different error"
              sqlite3 "$DB" "SELECT slot_type FROM clock_items LIMIT 1;" 2>&1
            fi

            echo ""
            echo "=== Restart novastream-admin ==="
            pm2 restart novastream-admin
            sleep 5

            echo ""
            echo "=== Check if port 3006 is now listening ==="
            ss -tlnp | grep 3006 || echo "STILL not on 3006"

            echo ""
            echo "=== Test /api/stream/next-track ==="
            curl -s http://localhost:3006/api/stream/next-track --max-time 5
            echo ""

            echo ""
            echo "=== PM2 status ==="
            pm2 list

            echo ""
            echo "=== PM2 error log (last 20) ==="
            pm2 logs novastream-admin --lines 20 --nostream 2>&1 | tail -25

            echo "DONE"
          command_timeout: 60s
