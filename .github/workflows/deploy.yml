name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect now-playing route and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Test now-playing with short timeout ==="
            curl -s --max-time 5 http://localhost:3006/api/stream/now || echo "TIMEOUT or ERROR"

            echo "=== Test now-playing on port 3001 (novastream) ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/now || echo "TIMEOUT or ERROR"

            echo "=== Check now-playing route in admin dist ==="
            grep -n "stream/now\|now-playing\|now_playing" /root/novastream-admin/dist/index.js | head -20

            echo "=== Check now-playing route code ==="
            grep -n "stream/now" /root/novastream-admin/dist/index.js | head -5

            echo "=== novastream-admin DB tables ==="
            sqlite3 /root/novastream-admin/novastream.db ".tables"

            echo "=== Check Icecast JSON stats ==="
            curl -s --max-time 5 http://localhost:8000/status-json.xsl | python3 -c "
import json,sys
try:
    d=json.load(sys.stdin)
    src = d.get('icestats',{}).get('source',{})
    if isinstance(src, list): src = src[0]
    print('title:', src.get('title','?'))
    print('artist:', src.get('artist','?'))
    print('song:', src.get('song','?'))
except Exception as e:
    print('Error:', e)
"
