name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy novastream-admin on port 3006
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            # 1. Pull latest code and build (force-sync to avoid divergent branch issues)
            cd /root/novastream-admin
            git fetch origin main
            git reset --hard origin/main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all

            # 2. Stop the old novastream process (which holds port 3006) if it exists
            pm2 stop novastream 2>/dev/null || true
            pm2 delete novastream 2>/dev/null || true

            # 3. Start/restart novastream-admin on port 3006 using ecosystem config
            pm2 startOrRestart /root/novastream-admin/ecosystem.config.cjs --update-env

            # 4. Save PM2 process list so it survives reboots
            pm2 save --force

            echo "=== PM2 status ==="
            pm2 list
            echo "=== Port 3006 health check ==="
            sleep 4
            curl -sf http://localhost:3006/api/health && echo "OK" || echo "FAILED"
          command_timeout: 10m

      - name: Update player HTML and nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            for WEBROOT in /var/www/html /var/www/streamofdan.com/html /var/www/streamofdan/html /usr/share/nginx/html; do
              if [ -f "$WEBROOT/index.html" ]; then
                cp /root/novastream-admin/player/index.html "$WEBROOT/index.html"
                echo "Updated player at $WEBROOT/index.html"
                break
              fi
            done
            CONF=$(grep -rl "server_name" /etc/nginx/sites-enabled/ 2>/dev/null | head -1)
            if [ -z "$CONF" ]; then CONF="/etc/nginx/sites-enabled/default"; fi
            if ! grep -q "stream/now" "$CONF"; then
              sed -i 's|location /stream {|location /api/stream/now {\n        proxy_pass http://127.0.0.1:3001/api/stream/now;\n        proxy_set_header Host $http_host;\n        add_header Cache-Control no-store;\n    }\n\n    location /stream {|' "$CONF"
              nginx -t && systemctl reload nginx && echo "nginx updated"
            fi
          command_timeout: 5m
