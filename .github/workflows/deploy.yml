name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check file locations and fix stream route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Find WMA files on disk ==="
            find /root/novastream /root/novastream-admin -name "*.wma" 2>/dev/null | head -10
            echo "=== DB filepath for track 185103 ==="
            sqlite3 /root/novastream/radio.db "SELECT filepath FROM tracks WHERE id=185103;" 2>/dev/null
            echo "=== Storage dirs ==="
            ls /root/novastream/storage/music/ 2>/dev/null | head -5 || echo "no storage/music"
            ls /root/novastream/music/ 2>/dev/null | head -5 || echo "no music dir"
            ls /root/novastream-admin/storage/music/ 2>/dev/null | head -5 || echo "no admin storage/music"
          command_timeout: 5m

      - name: Build and deploy novastream-admin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /root/novastream-admin
            git fetch origin main
            git reset --hard origin/main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all
            pm2 restart novastream-admin
            echo "novastream-admin restarted"
          command_timeout: 10m

      - name: Update player HTML
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            for WEBROOT in /var/www/html /var/www/streamofdan.com/html /var/www/streamofdan/html /usr/share/nginx/html; do
              if [ -f "$WEBROOT/index.html" ]; then
                cp /root/novastream-admin/player/index.html "$WEBROOT/index.html"
                echo "Updated player at $WEBROOT/index.html"
                break
              fi
            done
          command_timeout: 5m
