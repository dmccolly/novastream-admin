name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Liquidsoap and now-playing status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== PM2 process status ==="
            pm2 list

            echo "=== Liquidsoap process ==="
            ps aux | grep liquidsoap | grep -v grep

            echo "=== Icecast status ==="
            curl -s http://localhost:8000/status.xsl | head -50

            echo "=== novastream-admin recent logs ==="
            pm2 logs novastream-admin --lines 20 --nostream 2>&1 | tail -30

            echo "=== Test now-playing endpoint ==="
            curl -s http://localhost:3006/api/stream/now

            echo "=== Test next-track endpoint ==="
            curl -s http://localhost:3006/api/stream/next-track | head -200

            echo "=== Check play_history in admin DB ==="
            sqlite3 /root/novastream-admin/novastream.db "SELECT * FROM play_history ORDER BY played_at DESC LIMIT 5;" 2>/dev/null || echo "no play_history table or empty"

            echo "=== Check now_playing in admin DB ==="
            sqlite3 /root/novastream-admin/novastream.db ".tables" 2>/dev/null

            echo "=== Liquidsoap log ==="
            tail -20 /var/log/liquidsoap.log 2>/dev/null || find /var/log -name "*liquid*" 2>/dev/null | head -5
