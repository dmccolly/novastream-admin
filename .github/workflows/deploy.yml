name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Patch novastream for WMA transcoding
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            node << 'EOF'
            const fs = require('fs');
            const path = require('path');
            const distFile = '/root/novastream/dist/index.js';
            let code = fs.readFileSync(distFile, 'utf8');

            // Show the full stream route section
            const idx = code.indexOf('Audio file not found on server');
            if (idx >= 0) {
              console.log('=== FULL STREAM SECTION ===');
              console.log(JSON.stringify(code.substring(Math.max(0, idx-400), idx+800)));
            }

            // Show preview route section
            const idx2 = code.indexOf('[PREVIEW] Request received');
            if (idx2 >= 0) {
              console.log('=== FULL PREVIEW SECTION ===');
              console.log(JSON.stringify(code.substring(idx2, idx2+1200)));
            }
            EOF
          command_timeout: 2m

      - name: Build and deploy novastream-admin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /root/novastream-admin
            git fetch origin main
            git reset --hard origin/main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all
            pm2 restart novastream-admin
            echo "novastream-admin restarted"
          command_timeout: 10m
