name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  patch-novastream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create scripts dir on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: mkdir -p /root/novastream-admin/scripts
          command_timeout: 30s

      - name: Upload patch script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/patch-wma.js"
          target: "/root/novastream-admin/"

      - name: Run patch and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Running patch ==="
            node /root/novastream-admin/scripts/patch-wma.js

            echo "=== Restarting novastream ==="
            pm2 restart novastream
            sleep 4

            echo "=== Health ==="
            curl -sf http://localhost:3001/api/health && echo " OK" || echo " FAIL"

            echo "=== Stream test 185103 (WMA path, MP3 on disk) ==="
            RESP=$(curl -s http://localhost:3001/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd)
            echo "$RESP"

            echo "=== Stream test 212504 (raw WMA on disk) ==="
            curl -sI http://localhost:3001/api/tracks/212504/stream --max-time 8 | grep -i "HTTP\|content-type"
          command_timeout: 2m
