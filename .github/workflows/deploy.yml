name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  patch-novastream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload and run WMA patch script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            mkdir -p /root/novastream-admin/scripts
          command_timeout: 30s

      - name: Copy patch script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/patch-wma.js"
          target: "/root/novastream-admin/"

      - name: Run patch and restart novastream
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Running WMA patch ==="
            node /root/novastream-admin/scripts/patch-wma.js

            echo "=== Restarting novastream ==="
            pm2 restart novastream
            sleep 4

            echo "=== Health check ==="
            curl -sf http://localhost:3001/api/health && echo " HEALTHY" || echo " FAILED"

            echo "=== Preview for track 185103 (WMA with MP3 on disk) ==="
            curl -s http://localhost:3001/api/tracks/185103/preview

            echo ""
            echo "=== Stream headers for track 185103 ==="
            curl -sI http://localhost:3001/api/tracks/185103/stream --max-time 5 | grep -i "HTTP\|content-type"

            echo "=== Stream first 4 bytes for 185103 (FF FB or ID3 = valid MP3) ==="
            curl -s http://localhost:3001/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd

            echo "=== Preview for track 212504 (raw WMA on disk) ==="
            curl -s http://localhost:3001/api/tracks/212504/preview
            echo ""
          command_timeout: 2m
