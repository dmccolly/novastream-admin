name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy fix script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/fix-all-require.py"
          target: "/tmp/"
          strip_components: 1

      - name: Apply fix and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            python3 /tmp/fix-all-require.py
            pm2 restart novastream-admin
            sleep 5
            echo "=== NEXT-TRACK TEST ==="
            curl -s http://localhost:3006/api/stream/next-track | head -c 300
            echo ""
            echo "=== PM2 ERROR LOG ==="
            pm2 logs novastream-admin --nostream --lines 5 2>/dev/null | grep -i "error\|require" | head -5 || echo "No errors"

      - name: Deploy player
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "player/index.html"
          target: "/var/www/html/"
          strip_components: 1
