name: Deploy Now Playing Fix

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload dist to novastream app
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: dist/index.js
          target: /root/novastream/dist/
          strip_components: 1

      - name: Upload dist to novastream-admin app
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: dist/index.js
          target: /root/novastream-admin/dist/
          strip_components: 1

      - name: Upload Liquidsoap script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: novastream.liq
          target: /root/
          strip_components: 0

      - name: Restart Node apps and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40s
          script: |
            pm2 restart novastream novastream-admin
            sleep 6

            echo "=== Verify now-playing route in dist ==="
            grep -c "now-playing" /root/novastream/dist/index.js

            echo "=== Verify current_playing table in dist ==="
            grep -c "current_playing" /root/novastream/dist/index.js

            echo "=== Verify on_track in Liquidsoap script ==="
            grep -c "on_track" /root/novastream.liq

            echo "=== Test POST now-playing ==="
            curl -s -X POST -H 'Content-Type: application/json' \
              -d '{"filepath":"/root/novastream/storage/music/250553_1778099320620.mp3"}' \
              http://localhost:3001/api/stream/now-playing

            echo ""
            echo "=== Test GET now ==="
            curl -s http://localhost:3001/api/stream/now

            echo ""
            echo "=== PM2 status ==="
            pm2 list --no-color | grep -E "novastream"

      - name: Restart Liquidsoap detached
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15s
          script: |
            nohup bash -c 'sleep 2; pkill -f liquidsoap; sleep 5; /usr/bin/liquidsoap /root/novastream.liq >> /var/log/liquidsoap.log 2>&1 &' > /tmp/liq_restart.log 2>&1 &
            echo "Liquidsoap restart scheduled"
