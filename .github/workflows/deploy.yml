name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deep inspect preview and file mapping
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== What does the admin panel library show? ==="
            echo "Calling /api/tracks (first 5 tracks from admin panel perspective)"
            curl -s http://localhost:3001/api/tracks?limit=5 2>&1 | head -500

            echo "=== Track 27457 in backend DB ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT id, title, artist, filepath, status FROM tracks WHERE id=27457;"

            echo "=== Files in music dir matching 27457 ==="
            ls /root/novastream/storage/music/ | grep "27457" || echo "no files matching 27457"

            echo "=== What does the music dir contain? (sample) ==="
            ls /root/novastream/storage/music/ | head -5

            echo "=== Check how files are stored - what is the filepath format? ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT id, title, filepath FROM tracks WHERE filepath IS NOT NULL AND filepath != '' LIMIT 5;"

            echo "=== Check how many tracks have filepaths ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT COUNT(*) FROM tracks WHERE filepath IS NOT NULL AND filepath != '';"

            echo "=== Sample of tracks with filepaths ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT id, title, filepath FROM tracks WHERE filepath LIKE '%mp3%' LIMIT 5;"
