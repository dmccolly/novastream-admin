name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get broken require context and now-playing route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            BUNDLE="/root/novastream-admin/dist/index.js"
            echo "=== REQUIRE LINE ==="
            grep -n "__require\|createRequire\|require(" "$BUNDLE" | head -20
            echo "=== NOW-PLAYING ROUTE (lines around 'now-playing') ==="
            grep -n "now-playing\|now_playing\|nowPlaying" "$BUNDLE" | head -20
            echo "=== LINES AROUND REQUIRE ==="
            LINE=$(grep -n "__require" "$BUNDLE" | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              START=$((LINE - 3))
              END=$((LINE + 10))
              sed -n "${START},${END}p" "$BUNDLE"
            fi
