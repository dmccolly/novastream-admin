name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  check-require:
    runs-on: ubuntu-latest
    steps:
      - name: Check child_process import and WMA block in live dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Check child_process in bundle ==="
            node -e "
            var fs = require('fs');
            var code = fs.readFileSync('/root/novastream/dist/index.js', 'utf8');
            // Find how child_process is referenced
            var cpIdx = code.indexOf('child_process');
            console.log('child_process at:', cpIdx);
            if (cpIdx >= 0) console.log('Context:', JSON.stringify(code.slice(cpIdx-50, cpIdx+80)));
            // Find require in the bundle
            var reqIdx = code.indexOf('require(');
            console.log('require( at:', reqIdx);
            if (reqIdx >= 0) console.log('Context:', JSON.stringify(code.slice(reqIdx-20, reqIdx+60)));
            // Find our WMA block
            var wmaIdx = code.indexOf('wmaExt2');
            console.log('wmaExt2 at:', wmaIdx);
            console.log('WMA block (200 chars):', JSON.stringify(code.slice(wmaIdx-50, wmaIdx+300)));
            "
          command_timeout: 30s
