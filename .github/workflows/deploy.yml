name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect preview route and admin DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Preview route code (lines 540-580) ==="
            sed -n '540,580p' /root/novastream/dist/index.js

            echo "=== novastream-admin DB schema ==="
            sqlite3 /root/novastream-admin/novastream.db ".tables"

            echo "=== novastream-admin tracks schema ==="
            sqlite3 /root/novastream-admin/novastream.db ".schema tracks" 2>/dev/null || echo "no tracks table"

            echo "=== novastream-admin library schema ==="
            sqlite3 /root/novastream-admin/novastream.db ".schema library" 2>/dev/null || echo "no library table"

            echo "=== novastream-admin all tables ==="
            sqlite3 /root/novastream-admin/novastream.db ".schema"

            echo "=== Sample from novastream-admin DB ==="
            sqlite3 /root/novastream-admin/novastream.db "SELECT name FROM sqlite_master WHERE type='table';"
