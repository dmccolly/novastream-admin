name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check port 3001 vs 3006 routing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== What is on port 3001 ==="
            ss -tlnp | grep 3001
            ss -tlnp | grep 3006

            echo "=== PM2 ecosystem ==="
            cat /root/.pm2/dump.pm2 2>/dev/null | grep -A5 "novastream" | head -30
            cat /root/ecosystem.config.js 2>/dev/null | head -30

            echo "=== Port 3001 next-track ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/next-track | head -100

            echo "=== Port 3006 next-track ==="
            curl -s --max-time 5 http://localhost:3006/api/stream/next-track | head -100

            echo "=== Port 3001 stream/now ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/now | head -100

            echo "=== Port 3006 stream/now ==="
            curl -s --max-time 5 http://localhost:3006/api/stream/now | head -100

            echo "=== Which DB does port 3001 use ==="
            grep -n "radio.db\|novastream.db\|database" /root/novastream/dist/index.js | head -10

            echo "=== Which DB does port 3006 use ==="
            grep -n "radio.db\|novastream.db\|database" /root/novastream-admin/dist/index.js 2>/dev/null | head -10
