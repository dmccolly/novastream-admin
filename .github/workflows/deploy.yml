name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  inspect-stream-full:
    runs-on: ubuntu-latest
    steps:
      - name: Show full stream route structure in backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Full stream route from backup (try block start to catch end) ==="
            node -e "
            var fs = require('fs');
            var code = fs.readFileSync('/root/novastream/dist/index.js.bak', 'utf8');
            var idx = code.indexOf('Failed to stream track');
            var tryStart = code.lastIndexOf('try {', idx);
            var catchEnd = code.indexOf('});', idx) + 3;
            console.log('try starts at:', tryStart, 'catch ends at:', catchEnd);
            console.log(JSON.stringify(code.slice(tryStart - 200, catchEnd + 10)));
            "
          command_timeout: 30s
