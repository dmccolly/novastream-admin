name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  patch-wma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/patch-wma.py,scripts/inspect-preview.py"
          target: /tmp/
      - name: Inspect preview route pattern
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: python3 /tmp/scripts/inspect-preview.py
          command_timeout: 30s
