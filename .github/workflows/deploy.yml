name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show stream and preview route code in novastream dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            node -e "
            const fs = require('fs');
            const code = fs.readFileSync('/root/novastream/dist/index.js', 'utf8');
            // Find 'Audio file not found' context
            const idx1 = code.indexOf('Audio file not found');
            if (idx1 >= 0) {
              console.log('=== STREAM ROUTE (around Audio file not found) ===');
              console.log(code.substring(Math.max(0, idx1-300), idx1+300));
            }
            // Find preview route context
            const idx2 = code.indexOf('/music/');
            if (idx2 >= 0) {
              console.log('=== PREVIEW ROUTE (around /music/) ===');
              console.log(code.substring(Math.max(0, idx2-200), idx2+400));
            }
            // Find PREVIEW log
            const idx3 = code.indexOf('PREVIEW');
            if (idx3 >= 0) {
              console.log('=== PREVIEW LOG ===');
              console.log(code.substring(Math.max(0, idx3-100), idx3+500));
            }
            "
          command_timeout: 2m

      - name: Build and deploy novastream-admin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /root/novastream-admin
            git fetch origin main
            git reset --hard origin/main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all
            pm2 restart novastream-admin
            echo "novastream-admin restarted"
          command_timeout: 10m
