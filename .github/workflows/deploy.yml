name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup current dist on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            cp /root/novastream/dist/index.js /root/novastream/dist/index.js.bak
            cp /root/novastream-admin/dist/index.js /root/novastream-admin/dist/index.js.bak
            echo "Backups done"

      - name: Upload new dist to novastream
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: dist/index.js
          target: /root/novastream/dist/

      - name: Upload new dist to novastream-admin
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: dist/index.js
          target: /root/novastream-admin/dist/

      - name: Restart services and fix WMA
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Verify WMA fix in deployed dist ==="
            grep -c "NOT LIKE" /root/novastream/dist/index.js

            echo "=== Restarting novastream apps ==="
            pm2 restart novastream
            pm2 restart novastream-admin
            sleep 5

            echo "=== Verifying apps are running ==="
            pm2 list | grep -E "novastream|online|stopped"

            echo "=== Test next-track returns MP3 (not WMA) ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/next-track | grep -o '"filepath":"[^"]*"' | head -1

            echo "=== Trigger WMA to MP3 conversion ==="
            curl -s -X POST --max-time 10 http://localhost:3001/api/admin/convert-wma

            echo "=== Restart Liquidsoap to unstick from WMA file ==="
            pkill -f liquidsoap || true
            sleep 5
            ps aux | grep liquidsoap | grep -v grep | head -3

            echo "=== Wait for Liquidsoap watchdog to restart it ==="
            sleep 15
            ps aux | grep liquidsoap | grep -v grep | head -3

            echo "=== Check play_history updated ==="
            sqlite3 /root/novastream/radio.db "SELECT title, artist, played_at FROM play_history ORDER BY played_at DESC LIMIT 5;"

            echo "=== Check Icecast stream title ==="
            curl -s --max-time 5 http://localhost:8000/status-json.xsl | grep -o '"title":"[^"]*"' | head -1
