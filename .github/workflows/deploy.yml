name: Deploy Liquidsoap Fix

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload fixed Liquidsoap script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: novastream.liq,get_next_track.sh
          target: /root/
          strip_components: 0

      - name: Check syntax and restart Liquidsoap
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 40s
          script: |
            echo "=== Syntax check ==="
            /usr/bin/liquidsoap --check /root/novastream.liq 2>&1 | head -10
            SYNTAX_OK=$?

            if [ $SYNTAX_OK -eq 0 ]; then
              echo "Syntax OK - restarting Liquidsoap"
              nohup bash -c 'sleep 1; pkill -f liquidsoap; sleep 5; /usr/bin/liquidsoap /root/novastream.liq >> /var/log/liquidsoap.log 2>&1 &' > /tmp/liq_restart.log 2>&1 &
              echo "Restart scheduled"
            else
              echo "SYNTAX ERROR - not restarting"
            fi

      - name: Verify after restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            sleep 20
            echo "=== Icecast sources ==="
            curl -s http://localhost:8000/status-json.xsl 2>/dev/null | grep -o '"title":"[^"]*"' | head -1 || echo 'NO SOURCES'

            echo "=== Last 5 log lines ==="
            tail -5 /var/log/liquidsoap.log
