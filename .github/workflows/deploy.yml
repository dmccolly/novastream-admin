name: Verify Dropbox Fix

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Verify Dropbox fix and crash loop stopped
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Waiting 30s to check restart counts ==="
            sleep 30

            echo "=== PM2 status (checking restart counts) ==="
            pm2 list --no-color 2>&1

            echo "=== novastream-admin error log (last 10 lines) ==="
            tail -10 /root/.pm2/logs/novastream-admin-error.log 2>/dev/null

            echo "=== novastream error log (last 10 lines) ==="
            tail -10 /root/.pm2/logs/novastream-error.log 2>/dev/null

            echo "=== Test Dropbox API from novastream-admin ==="
            curl -s http://localhost:3006/api/auth/dropbox/url 2>&1

            echo "=== Test Dropbox sync endpoint ==="
            curl -s --max-time 10 -X POST http://localhost:3006/api/sync 2>&1 | head -c 200

            echo "=== Stream health ==="
            curl -s http://localhost:3001/api/health 2>&1
            curl -s http://localhost:3006/api/health 2>&1

            echo "=== Now Playing ==="
            curl -s http://localhost:3001/api/stream/now 2>&1

            echo "=== Stream audio check ==="
            curl -s --max-time 3 http://localhost:8000/stream -o /tmp/final_check.bin
            ls -la /tmp/final_check.bin
            xxd /tmp/final_check.bin 2>/dev/null | head -2
