name: Deploy Recently Played Fix

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Pre-deploy Now Playing ==="
            curl -s http://localhost:3001/api/stream/now

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "dist/index.js"
          target: "/root/novastream/dist/"
          strip_components: 1

      - name: Restart and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            pm2 restart novastream
            sleep 5
            echo "=== PM2 status ==="
            pm2 list --no-color | grep novastream
            echo "=== Post-deploy Now Playing ==="
            curl -s http://localhost:3001/api/stream/now
            echo "=== Health ==="
            curl -s http://localhost:3001/api/health
