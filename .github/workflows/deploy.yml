name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full diagnostic and fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== PM2 status ==="
            pm2 list 2>&1 | grep -E "name|novastream|online|stopped|errored"

            echo "=== Liquidsoap process ==="
            ps aux | grep liquidsoap | grep -v grep | head -3

            echo "=== Recent play_history ==="
            sqlite3 /root/novastream/radio.db "SELECT title, artist, played_at FROM play_history ORDER BY played_at DESC LIMIT 3;"

            echo "=== Icecast status ==="
            curl -s --max-time 5 http://localhost:8000/status-json.xsl | head -5

            echo "=== Test next-track ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/next-track | head -200

            echo "=== novastream error log ==="
            pm2 logs novastream --lines 10 --err --nostream 2>&1 | tail -15

            echo "=== nginx music route ==="
            grep -A3 "location /music" /etc/nginx/sites-enabled/novastream 2>/dev/null || echo "no music route"

            echo "=== novastream dist routes ==="
            grep -n "now-playing\|now_playing\|play_history" /root/novastream/dist/index.js | head -10
