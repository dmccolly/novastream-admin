name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check novastream backend source and add now-playing route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Check novastream backend source ==="
            ls /root/novastream-backend/

            echo "=== Check novastream backend routes ==="
            find /root/novastream-backend -name "*.ts" -o -name "*.js" | grep -v node_modules | grep -v dist | head -10

            echo "=== Check novastream radio.db tables ==="
            sqlite3 /root/novastream/radio.db ".tables"

            echo "=== Check play_history in novastream radio.db ==="
            sqlite3 /root/novastream/radio.db ".schema play_history" 2>&1 || echo "no play_history"

            echo "=== Recent play_history in novastream radio.db ==="
            sqlite3 /root/novastream/radio.db "SELECT * FROM play_history ORDER BY played_at DESC LIMIT 5;" 2>&1

            echo "=== Check novastream dist/index.js stream/now route ==="
            grep -n "stream/now\|play_history" /root/novastream/dist/index.js | head -20

            echo "=== Check novastream backend source files ==="
            ls /root/novastream-backend/src/ 2>/dev/null || ls /root/novastream-backend/ | head -20
