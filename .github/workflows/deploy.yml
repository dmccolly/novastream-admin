name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy password-protected player to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "player/index.html"
          target: "/var/www/html/"
          strip_components: 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            grep -q "borah" /var/www/html/index.html && echo "PASSWORD GATE: OK" || echo "PASSWORD GATE: MISSING"
            grep -q "Enter Password" /var/www/html/index.html && echo "GATE UI: OK" || echo "GATE UI: MISSING"
            curl -s -o /dev/null -w "STREAM: HTTP %{http_code}\n" http://localhost:8000/stream --max-time 5
