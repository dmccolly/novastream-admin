name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect DB schema and preview API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== DB schema for tracks table ==="
            sqlite3 /root/novastream-backend/radio.db ".schema tracks"

            echo "=== Sample tracks from DB ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT * FROM tracks LIMIT 3;"

            echo "=== Track 1 full row ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT * FROM tracks WHERE id=1;"

            echo "=== Files in music dir that match track 1 ==="
            ls /root/novastream/storage/music/ | grep "^27457_" || echo "no match for 27457"

            echo "=== Preview route in novastream dist/index.js ==="
            grep -n "preview" /root/novastream/dist/index.js | head -20

            echo "=== Check what file track 1 actually has ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT id, title, artist FROM tracks WHERE id=1;"
