name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify music files and preview API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Music directory contents (first 10 files) ==="
            ls /root/novastream/storage/music/ | head -10
            echo "Total files:"
            ls /root/novastream/storage/music/ | wc -l

            echo "=== Track 1 in DB ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT id, title, artist, file_path, status FROM tracks WHERE id=1 LIMIT 1;"

            echo "=== Find some ready tracks with existing files ==="
            sqlite3 /root/novastream-backend/radio.db "SELECT id, title, file_path FROM tracks WHERE status='ready' LIMIT 5;"

            echo "=== Test preview API for track 1 ==="
            curl -s http://localhost:3001/api/tracks/1/preview

            echo "=== Check novastream PM2 status ==="
            pm2 list | grep novastream

            echo "=== Check nginx music location ==="
            grep -A3 "location /music" /etc/nginx/sites-enabled/novastream
