name: Debug Liquidsoap Script

on:
  push:
    branches: [main]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check Liquidsoap version and test script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 40s
          script: |
            echo "=== Liquidsoap version ==="
            /usr/bin/liquidsoap --version 2>&1 | head -3

            echo "=== Check script syntax ==="
            /usr/bin/liquidsoap --check /root/novastream.liq 2>&1 | head -30

            echo "=== Liquidsoap stderr log (last 30 lines) ==="
            tail -30 /var/log/liquidsoap.log 2>/dev/null

            echo "=== Current Liquidsoap processes ==="
            pgrep -a liquidsoap 2>/dev/null || echo "NOT RUNNING"

            echo "=== Check if source.on_track exists ==="
            /usr/bin/liquidsoap 'source.on_track' 2>&1 | head -5

            echo "=== Test get_next_track.sh ==="
            timeout 5 /root/get_next_track.sh 2>&1 || echo "Script failed or timed out"
