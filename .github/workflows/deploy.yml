name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find now-playing POST route and fix it
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Find now-playing POST route in novastream dist ==="
            grep -n "now-playing\|now_playing\|POST.*stream\|stream.*POST" /root/novastream/dist/index.js | head -20

            echo "=== Check lines 1360-1390 in novastream dist ==="
            sed -n '1360,1390p' /root/novastream/dist/index.js

            echo "=== Check what port novastream app listens on ==="
            grep -n "listen\|PORT\|port" /root/novastream/dist/index.js | tail -10

            echo "=== Check all POST routes in novastream dist ==="
            grep -n "app.*post\|app2.*post\|\.post(" /root/novastream/dist/index.js | head -20

            echo "=== Check novastream backend routes.ts for now-playing ==="
            grep -n "now-playing\|now_playing" /root/novastream-backend/server/routes.ts | head -10

            echo "=== Check what port novastream-backend runs on ==="
            grep -n "listen\|PORT\|port" /root/novastream-backend/server/index.ts | head -10
