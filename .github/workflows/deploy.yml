name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /root/novastream-admin
            git pull origin main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all
            # Find where the 'novastream' PM2 process runs from and copy the new dist there
            NOVA_SCRIPT=$(pm2 jlist 2>/dev/null | python3 -c "import json,sys; procs=json.load(sys.stdin); [print(p['pm2_env']['pm_exec_path']) for p in procs if p['name']=='novastream']" 2>/dev/null | head -1)
            if [ -n "$NOVA_SCRIPT" ]; then
              NOVA_DIR=$(dirname "$NOVA_SCRIPT")
              echo "novastream runs from: $NOVA_DIR"
              cp /root/novastream-admin/dist/index.js "$NOVA_DIR/index.js"
              echo "Copied new dist/index.js to $NOVA_DIR"
            fi
            # Restart both PM2 processes
            pm2 restart novastream || true
            pm2 restart novastream-admin || true
            # Run WMA-to-MP3 migration on existing files (background, non-blocking)
            nohup node -e "
              const {execSync} = require('child_process');
              const fs = require('fs');
              const path = require('path');
              const musicDir = '/root/novastream/storage/music';
              if (!fs.existsSync(musicDir)) process.exit(0);
              const files = fs.readdirSync(musicDir).filter(f => f.toLowerCase().endsWith('.wma'));
              console.log('[MIGRATE] Found', files.length, 'WMA files to convert');
              files.forEach(f => {
                const inp = path.join(musicDir, f);
                const out = inp.replace(/\\.wma$/i, '.mp3');
                try {
                  execSync('ffmpeg -y -i ' + JSON.stringify(inp) + ' -vn -acodec libmp3lame -ab 192k -ar 44100 -f mp3 ' + JSON.stringify(out), {stdio:'pipe'});
                  fs.unlinkSync(inp);
                  console.log('[MIGRATE] Converted:', f);
                } catch(e) { console.error('[MIGRATE] Failed:', f, e.message.slice(0,100)); }
              });
            " > /tmp/wma-migrate.log 2>&1 &
            echo "WMA migration started in background (see /tmp/wma-migrate.log)"
          command_timeout: 10m

      - name: Update player HTML and nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            for WEBROOT in /var/www/html /var/www/streamofdan.com/html /var/www/streamofdan/html /usr/share/nginx/html; do
              if [ -f "$WEBROOT/index.html" ]; then
                cp /root/novastream-admin/player/index.html "$WEBROOT/index.html"
                echo "Updated player at $WEBROOT/index.html"
                break
              fi
            done
            CONF=$(grep -rl "server_name" /etc/nginx/sites-enabled/ 2>/dev/null | head -1)
            if [ -z "$CONF" ]; then CONF="/etc/nginx/sites-enabled/default"; fi
            if ! grep -q "stream/now" "$CONF"; then
              sed -i 's|location /stream {|location /api/stream/now {\n        proxy_pass http://127.0.0.1:3001/api/stream/now;\n        proxy_set_header Host $http_host;\n        add_header Cache-Control no-store;\n    }\n\n    location /stream {|' "$CONF"
              nginx -t && systemctl reload nginx && echo "nginx updated"
            fi
          command_timeout: 5m
