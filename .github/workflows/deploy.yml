name: Diagnose and Fix

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check novastream-admin crash loop and Now Playing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 40s
          script: |
            echo "=== PM2 status ==="
            pm2 list --no-color 2>&1

            echo "=== novastream-admin PM2 logs (last 30 lines) ==="
            pm2 logs novastream-admin --lines 30 --nostream 2>&1 | tail -40

            echo "=== Now Playing API ==="
            curl -s http://localhost:3001/api/stream/now 2>&1

            echo "=== novastream PM2 logs (last 10 lines) ==="
            pm2 logs novastream --lines 10 --nostream 2>&1 | tail -20

            echo "=== Liquidsoap process ==="
            pgrep -a liquidsoap

            echo "=== Icecast now playing ==="
            curl -s http://localhost:8000/status.xsl 2>&1 | grep -o "Currently playing.*</td>" | head -3
