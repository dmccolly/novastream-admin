name: Patch Stream Server Recently Played Filter

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload patch script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/patch_recently_played.py"
          target: "/root/novastream/"
          strip_components: 1

      - name: Run patch script and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Running patch script ==="
            python3 /root/novastream/patch_recently_played.py

            echo "=== Restarting novastream ==="
            pm2 restart novastream
            sleep 5

            echo "=== Testing API ==="
            curl -s http://localhost:3001/api/stream/now
