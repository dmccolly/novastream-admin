name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find novastream DB and add now-playing route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== Find what DB novastream app uses ==="
            grep -n "database\|\.db\|sqlite" /root/novastream/dist/index.js | head -20

            echo "=== Find DB path in novastream ==="
            grep -n "radio\.db\|novastream\.db\|\.db" /root/novastream/dist/index.js | head -10

            echo "=== Find all DB files on server ==="
            find /root -name "*.db" 2>/dev/null

            echo "=== Check tables in novastream app DB ==="
            DB=$(grep -o '[^ ]*\.db' /root/novastream/dist/index.js | head -1)
            echo "DB path from code: $DB"

            echo "=== Check now-playing route in novastream dist ==="
            grep -n "now-playing\|now_playing" /root/novastream/dist/index.js | head -10

            echo "=== Check novastream ecosystem config ==="
            cat /root/novastream/ecosystem.config.cjs 2>/dev/null || cat /root/novastream/ecosystem.config.js 2>/dev/null || echo "no ecosystem config"

            echo "=== Check novastream env ==="
            cat /root/novastream/.env 2>/dev/null || echo "no .env"

            echo "=== Check novastream package.json ==="
            cat /root/novastream/package.json | head -20
