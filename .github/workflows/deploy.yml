name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check state and restart Liquidsoap if needed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 25s
          script: |
            echo "=== Liquidsoap processes ==="
            ps aux | grep liquidsoap | grep -v grep || echo "NO LIQUIDSOAP RUNNING"

            echo "=== Restart log ==="
            cat /tmp/restart_liq2.log 2>/dev/null || echo "no restart log"
            cat /tmp/liq_restart2_status.txt 2>/dev/null || echo "no status"

            echo "=== Liquidsoap log last 10 ==="
            tail -10 /var/log/liquidsoap.log

            echo "=== Icecast sources ==="
            curl -s --max-time 3 http://localhost:8000/status-json.xsl | grep -o '"mount":"[^"]*"' || echo "no sources"

            echo "=== If not running, start now ==="
            if ! pgrep -f liquidsoap > /dev/null; then
              echo "Starting Liquidsoap..."
              nohup /usr/bin/liquidsoap /root/novastream.liq >> /var/log/liquidsoap.log 2>&1 &
              echo "Started PID: $!"
            else
              echo "Liquidsoap is running"
            fi
