name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  diagnose-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check file paths and fix WMA stream
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== DB filepath for track 185103 ==="
            sqlite3 /root/novastream/radio.db "SELECT id, filepath, filename FROM tracks WHERE id=185103;" 2>/dev/null || \
            sqlite3 /root/novastream/radio.db "SELECT id, filepath FROM tracks WHERE id=185103;" 2>/dev/null || \
            echo "sqlite3 not available or different db path"

            echo "=== Find the actual DB file ==="
            find /root/novastream -name "*.db" -o -name "*.sqlite" 2>/dev/null | head -5

            echo "=== Files in storage/music matching 185103 ==="
            ls /root/novastream/storage/music/ 2>/dev/null | grep "185103" || echo "No match"

            echo "=== All WMA files in storage ==="
            find /root/novastream/storage -name "*.wma" 2>/dev/null | head -10

            echo "=== Check what filepath the API returns for track 185103 ==="
            curl -s http://localhost:3001/api/tracks/185103 | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const t=JSON.parse(d); console.log('filepath:', t.filepath); console.log('url:', t.url);"

            echo "=== Check if the filepath from API actually exists ==="
            FILEPATH=$(curl -s http://localhost:3001/api/tracks/185103 | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).filepath));")
            echo "filepath from API: $FILEPATH"
            ls -la "$FILEPATH" 2>/dev/null && echo "FILE EXISTS" || echo "FILE NOT FOUND"

            echo "=== Check the stream route code in dist/index.js ==="
            grep -o "Audio file not found.*" /root/novastream/dist/index.js | head -3
            grep -o "fs\.existsSync[^)]*)" /root/novastream/dist/index.js | head -3
          command_timeout: 2m
