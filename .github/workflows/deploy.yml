name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH Key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /root/novastream-admin
            git pull origin main
            NODE_OPTIONS=--max-old-space-size=512 npm run build:all

            # Force pm2 to run the correct built file
            pm2 stop novastream-admin || true
            pm2 delete novastream-admin || true
            pm2 start /root/novastream-admin/dist/server/index.js --name novastream-admin
            pm2 save

            # Update player HTML in nginx web root (try common locations)
            for WEBROOT in /var/www/html /var/www/streamofdan.com/html /var/www/streamofdan/html /usr/share/nginx/html; do
              if [ -f "$WEBROOT/index.html" ]; then
                cp /root/novastream-admin/player/index.html "$WEBROOT/index.html"
                echo "Copied player HTML to $WEBROOT/index.html"
                break
              fi
            done

            # Add nginx proxy for /api/stream/now if not already present
            CONF=$(grep -rl "streamofdan\|server_name" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -1)
            if [ -z "$CONF" ]; then CONF="/etc/nginx/sites-enabled/default"; fi
            if ! grep -q "stream/now" "$CONF"; then
              printf '\nlocation /api/stream/now {\n    proxy_pass http://127.0.0.1:3001/api/stream/now;\n    proxy_set_header Host $host;\n    add_header Cache-Control no-store;\n}\n' >> "$CONF"
              nginx -t && systemctl reload nginx && echo "Nginx updated"
            fi
          command_timeout: 10m
