name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  patch-wma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "scripts/patch-wma.py,scripts/patch-nowplaying.py"
          target: /tmp/
      - name: Apply all patches and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== PATCH 1-3: WMA server patch ==="
            python3 /tmp/scripts/patch-wma.py
            echo "=== PATCH 4: Now Playing frontend patch ==="
            python3 /tmp/scripts/patch-nowplaying.py
            echo "=== Restarting novastream ==="
            pm2 restart novastream
            sleep 3
            echo "=== Health ==="
            curl -s http://localhost:3001/api/health && echo " OK" || echo " FAIL"
            echo "=== Stream test 185103 ==="
            curl -s http://localhost:3001/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd
            echo "=== Preview test 185103 ==="
            curl -s http://localhost:3001/api/tracks/185103/preview
            echo ""
            echo "=== DRM test 212504 ==="
            curl -s http://localhost:3001/api/tracks/212504/stream --max-time 12
            echo ""
            echo "=== Public stream test ==="
            curl -s https://api.danielmccolly.com/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd
          command_timeout: 60s
