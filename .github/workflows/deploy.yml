name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose Liquidsoap silence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 45s
          script: |
            echo "=== Liquidsoap process ==="
            ps aux | grep liquidsoap | grep -v grep

            echo "=== Liquidsoap last 50 log lines ==="
            tail -50 /var/log/liquidsoap.log 2>/dev/null || tail -50 /root/novastream/liquidsoap.log 2>/dev/null || find /var/log /root -name "*.log" 2>/dev/null | xargs grep -l liquidsoap 2>/dev/null | head -3

            echo "=== PM2 novastream logs last 20 ==="
            pm2 logs novastream --lines 20 --nostream 2>/dev/null | tail -25

            echo "=== Test next-track ==="
            curl -s --max-time 5 http://localhost:3001/api/stream/next-track | grep -o '"filepath":"[^"]*"' | head -1

            echo "=== Test that file exists ==="
            FILEPATH=$(curl -s --max-time 5 http://localhost:3001/api/stream/next-track | grep -o '"filepath":"[^"]*"' | sed 's/"filepath":"//;s/"//')
            echo "filepath: $FILEPATH"
            ls -la "$FILEPATH" 2>/dev/null || echo "FILE NOT FOUND"
            file "$FILEPATH" 2>/dev/null || echo "cannot file"
