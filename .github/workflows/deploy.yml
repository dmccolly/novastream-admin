name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  inspect-stream-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Show stream route try/catch wrapper in backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Find Failed to stream track in backup ==="
            node -e "
            var fs = require('fs');
            var code = fs.readFileSync('/root/novastream/dist/index.js.bak', 'utf8');
            var idx = code.indexOf('Failed to stream track');
            if (idx < 0) { console.log('Not found'); process.exit(1); }
            console.log('Found at:', idx);
            console.log('Context (400 before, 200 after):');
            console.log(JSON.stringify(code.slice(idx-400, idx+200)));
            "
          command_timeout: 30s
