name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check novastream app structure and fix WMA issue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== novastream app structure ==="
            ls /root/novastream/
            ls /root/novastream/src/ 2>/dev/null || echo "no src dir"
            ls /root/novastream/server/ 2>/dev/null || echo "no server dir"

            echo "=== next-track route in port 3001 dist ==="
            grep -n "next-track\|wma\|WMA\|status.*ready\|filepath.*LIKE" /root/novastream/dist/index.js | head -20

            echo "=== WMA tracks in port 3001 DB ==="
            sqlite3 /root/novastream/radio.db "SELECT COUNT(*) FROM tracks WHERE filepath LIKE '%.wma' AND status='ready';"
            sqlite3 /root/novastream/radio.db "SELECT COUNT(*) FROM tracks WHERE status='ready' AND (filepath LIKE '%.mp3' OR filepath LIKE '%.wav');"

            echo "=== Check if novastream has package.json with build script ==="
            cat /root/novastream/package.json 2>/dev/null | head -20

            echo "=== Liquidsoap log (find it) ==="
            find /root /tmp /var/log -name "liquidsoap*.log" 2>/dev/null | head -5
            cat /root/.pm2/logs/liquidsoap-out.log 2>/dev/null | tail -20 || echo "no pm2 liquidsoap log"
            pm2 list 2>&1 | grep liquidsoap
