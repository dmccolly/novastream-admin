name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          command_timeout: 120s
          script: |
            set -e
            cd /root/novastream-admin
            git fetch origin
            git reset --hard origin/main
            git clean -fd --exclude=radio.db --exclude=.env --exclude=storage --exclude=node_modules
            npm install --legacy-peer-deps
            npm run build
            pm2 restart novastream-admin
            echo "Deploy complete"
