name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  patch-novastream:
    runs-on: ubuntu-latest
    steps:
      - name: Patch novastream dist for WMA transcoding (no build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            node << 'JSEOF'
            const fs = require('fs');
            const path = require('path');
            const distFile = '/root/novastream/dist/index.js';

            // Restore from backup if it exists
            if (fs.existsSync(distFile + '.bak')) {
              fs.copyFileSync(distFile + '.bak', distFile);
              console.log('Restored from backup first');
            }

            let code = fs.readFileSync(distFile, 'utf8');
            const original = code;

            // PATCH 1: Preview route - return /stream URL for WMA files
            // Find the exact preview filepath block and add WMA check before it
            const previewOld = 'if (track.filepath) {\n        const localUrl = `/music/${path2.basename(track.filepath)}`;\n        console.log("[PREVIEW] Track has filepath, returning local URL:", localUrl);\n        return res.json({ url: localUrl });\n      }';
            const previewNew = 'if (track.filepath) {\n        if (path.extname(track.filepath).toLowerCase() === \'.wma\') {\n          console.log("[PREVIEW] WMA detected, routing to stream for transcoding");\n          return res.json({ url: `/api/tracks/${id}/stream` });\n        }\n        const localUrl = `/music/${path2.basename(track.filepath)}`;\n        console.log("[PREVIEW] Track has filepath, returning local URL:", localUrl);\n        return res.json({ url: localUrl });\n      }';

            if (code.includes(previewOld)) {
              code = code.replace(previewOld, previewNew);
              console.log('PATCH 1 OK: preview WMA redirect');
            } else {
              console.log('PATCH 1 SKIP: pattern not found (may already be patched)');
            }

            // PATCH 2: Stream route - add ffmpeg transcoding for WMA before the range-request logic
            // Find the exact block after existsSync check
            const streamOld = 'if (!fs.existsSync(track.filepath)) {\n        return res.status(404).json({ error: "Audio file not found on server" });\n      }\n      const stat = fs.statSync(track.filepath);';
            const streamNew = 'if (!fs.existsSync(track.filepath)) {\n        return res.status(404).json({ error: "Audio file not found on server" });\n      }\n      if (path.extname(track.filepath).toLowerCase() === \'.wma\') {\n        const { spawn } = require(\'child_process\');\n        res.setHeader(\'Content-Type\', \'audio/mpeg\');\n        res.setHeader(\'Transfer-Encoding\', \'chunked\');\n        res.setHeader(\'Access-Control-Allow-Origin\', \'*\');\n        const ff = spawn(\'ffmpeg\', [\'-i\', track.filepath, \'-vn\', \'-ar\', \'44100\', \'-ac\', \'2\', \'-b:a\', \'192k\', \'-f\', \'mp3\', \'pipe:1\'], { stdio: [\'ignore\', \'pipe\', \'ignore\'] });\n        ff.stdout.pipe(res);\n        ff.on(\'error\', function(e) { console.error(\'ffmpeg error:\', e); if (!res.headersSent) res.status(500).end(); });\n        req.on(\'close\', function() { ff.kill(); });\n        return;\n      }\n      const stat = fs.statSync(track.filepath);';

            if (code.includes(streamOld)) {
              code = code.replace(streamOld, streamNew);
              console.log('PATCH 2 OK: stream WMA transcoding');
            } else {
              console.log('PATCH 2 SKIP: pattern not found (may already be patched)');
            }

            if (code !== original) {
              fs.writeFileSync(distFile + '.bak', original);
              fs.writeFileSync(distFile, code);
              console.log('SUCCESS: Patched dist/index.js written');
            } else {
              console.log('INFO: No changes needed');
            }
            JSEOF

            echo "Restarting novastream process..."
            pm2 restart novastream
            sleep 4

            echo "=== Health check ==="
            curl -sf http://localhost:3001/api/health && echo " HEALTHY" || echo " FAILED"

            echo "=== Preview test for WMA track 185103 ==="
            curl -s http://localhost:3001/api/tracks/185103/preview

            echo ""
            echo "=== Stream test for WMA track 185103 (checking content-type) ==="
            curl -sI http://localhost:3001/api/tracks/185103/stream | grep -i "content-type"

            echo "=== Stream byte test (should be MP3 header FF FB or ID3) ==="
            curl -s http://localhost:3001/api/tracks/185103/stream --max-time 4 | head -c 4 | xxd
          command_timeout: 3m
