name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  inspect-liquidsoap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Liquidsoap script and API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== /root/novastream.liq ==="
            cat /root/novastream.liq

            echo ""
            echo "=== Test the API endpoint Liquidsoap calls ==="
            # Try common endpoints
            echo "--- /api/stream/next ---"
            curl -s http://localhost:3001/api/stream/next --max-time 5
            echo ""
            echo "--- /api/stream/track ---"
            curl -s http://localhost:3001/api/stream/track --max-time 5
            echo ""
            echo "--- /api/stream/now ---"
            curl -s http://localhost:3001/api/stream/now --max-time 5
            echo ""
            echo "--- /api/tracks/random ---"
            curl -s http://localhost:3001/api/tracks/random --max-time 5
            echo ""

            echo ""
            echo "=== novastream server routes (grep stream) ==="
            grep -n "stream\|next\|track\|liquidsoap\|icecast" /root/novastream/server/index.js 2>/dev/null | head -40

            echo ""
            echo "=== Liquidsoap full log (last 50 lines) ==="
            journalctl -u liquidsoap --no-pager -n 50 2>&1

            echo "DONE"
          command_timeout: 60s
