name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  verify-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live patch and test stream
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "=== Check if WMA patch is in live dist/index.js ==="
            node -e "
            var fs = require('fs');
            var code = fs.readFileSync('/root/novastream/dist/index.js', 'utf8');
            console.log('wmaExt2 present:', code.includes('wmaExt2'));
            console.log('ffProc present:', code.includes('ffProc'));
            console.log('wmaBytesWritten present:', code.includes('wmaBytesWritten'));
            var idx = code.indexOf('Audio file not found on server');
            console.log('404 marker at:', idx);
            console.log('Context around 404 marker:');
            console.log(JSON.stringify(code.slice(idx-200, idx+50)));
            "

            echo "=== Test stream 212504 directly ==="
            curl -s http://localhost:3001/api/tracks/212504/stream --max-time 10

            echo "=== Test stream 185103 directly ==="
            curl -s http://localhost:3001/api/tracks/185103/stream --max-time 5 | head -c 4 | xxd
          command_timeout: 30s
