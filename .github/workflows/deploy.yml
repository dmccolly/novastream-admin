name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy player
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            cat > /var/www/html/index.html << 'HTMLEOF'
            PLACEHOLDER
            HTMLEOF
            echo "step1 done"

      - name: Copy player file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "player/index.html"
          target: "/var/www/html/"
          strip_components: 1

      - name: Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 15s
          script: |
            SIZE=$(wc -c < /var/www/html/index.html)
            echo "File size: $SIZE bytes"
            grep -c "flex-start" /var/www/html/index.html && echo "CSS FIX: OK" || echo "CSS FIX: MISSING"
