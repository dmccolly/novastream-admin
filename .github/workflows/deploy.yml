name: Check and Restart Liquidsoap

on:
  push:
    branches: [main]

jobs:
  check-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check Liquidsoap and restart if needed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 40s
          script: |
            echo "=== Liquidsoap processes ==="
            pgrep -a liquidsoap || echo "NOT RUNNING"

            echo "=== Icecast sources ==="
            curl -s http://localhost:8000/status-json.xsl | python3 -c "import json,sys; d=json.load(sys.stdin); src=d.get('icestats',{}).get('source'); print('Source:', src.get('title') if src and not isinstance(src,list) else (src[0].get('title') if src else 'NONE'))" 2>/dev/null || echo "Icecast check failed"

            echo "=== Last 20 lines of Liquidsoap log ==="
            tail -20 /var/log/liquidsoap.log 2>/dev/null || echo "No log file"

            echo "=== Verify on_track in deployed script ==="
            grep -c "on_track" /root/novastream.liq

            echo "=== Starting Liquidsoap if not running ==="
            if ! pgrep -f liquidsoap > /dev/null; then
              /usr/bin/liquidsoap /root/novastream.liq >> /var/log/liquidsoap.log 2>&1 &
              echo "Started Liquidsoap PID: $!"
            else
              echo "Liquidsoap already running"
            fi

            sleep 8
            echo "=== Icecast sources after restart ==="
            curl -s http://localhost:8000/status-json.xsl | python3 -c "import json,sys; d=json.load(sys.stdin); src=d.get('icestats',{}).get('source'); print('Source:', src.get('title') if src and not isinstance(src,list) else (src[0].get('title') if src else 'NONE'))" 2>/dev/null || echo "check failed"
