name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the stream/now handler from server bundle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            BUNDLE="/root/novastream-admin/dist/index.js"
            echo "=== STREAM/NOW HANDLER ==="
            grep -n "stream/now\|now-playing\|play_history\|recently_played\|now_playing" "$BUNDLE" | head -30
            echo "=== LINE NUMBERS FOR stream/now ==="
            grep -n '"stream/now"' "$BUNDLE" | head -10
            echo "=== PLAY_HISTORY TABLE SCHEMA ==="
            sqlite3 /root/novastream-admin/radio.db ".schema play_history" 2>/dev/null || echo "No play_history table"
            echo "=== RECENTLY_PLAYED TABLE SCHEMA ==="
            sqlite3 /root/novastream-admin/radio.db ".schema recently_played" 2>/dev/null || echo "No recently_played table"
            echo "=== ALL TABLES ==="
            sqlite3 /root/novastream-admin/radio.db ".tables" 2>/dev/null
            echo "=== LAST 5 PLAY_HISTORY ROWS ==="
            sqlite3 /root/novastream-admin/radio.db "SELECT id,track_id,played_at FROM play_history ORDER BY played_at DESC LIMIT 5;" 2>/dev/null || echo "No data"
            echo "=== CURRENT NOW-PLAYING API RESPONSE ==="
            curl -s http://localhost:3006/api/stream/now | head -c 500
