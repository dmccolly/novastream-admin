name: Deploy Recently Played Fix

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload dist/index.js to novastream
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== Pre-deploy: current Now Playing ==="
            curl -s http://localhost:3001/api/stream/now

      - name: Copy fixed dist to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 137.184.12.217 >> ~/.ssh/known_hosts
          scp dist/index.js root@137.184.12.217:/root/novastream/dist/index.js

      - name: Restart novastream and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            pm2 restart novastream
            sleep 5
            echo "=== PM2 status ==="
            pm2 list --no-color | grep novastream
            echo "=== Post-deploy: Now Playing API ==="
            curl -s http://localhost:3001/api/stream/now
            echo "=== Stream health ==="
            curl -s http://localhost:3001/api/health
