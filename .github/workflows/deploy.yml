name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check current Liquidsoap state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== Liquidsoap processes ==="
            ps aux | grep liquidsoap | grep -v grep

            echo "=== Restart script status ==="
            cat /tmp/liq_restart_status.txt 2>/dev/null || echo "no status file"
            cat /tmp/restart_liq.log 2>/dev/null || echo "no restart log"

            echo "=== Liquidsoap log last 30 lines ==="
            tail -30 /var/log/liquidsoap.log

            echo "=== play_history last 5 ==="
            sqlite3 /root/novastream/radio.db "SELECT title, artist, played_at FROM play_history ORDER BY played_at DESC LIMIT 5;"

            echo "=== Stream bytes ==="
            curl -s --max-time 3 http://localhost:8000/stream | head -c 8 | xxd
