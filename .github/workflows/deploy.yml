name: Verify Recently Played Filter

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check deployed bundle and live DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== Check if filter is in deployed bundle ==="
            grep -c "Unknown Artist" /root/novastream/dist/index.js || echo "NOT FOUND"

            echo "=== Last 10 play_history rows (port 3001 DB) ==="
            sqlite3 /root/novastream/radio.db "SELECT title, artist, played_at FROM play_history ORDER BY played_at DESC LIMIT 10;"

            echo "=== Now Playing API (port 3001) ==="
            curl -s http://localhost:3001/api/stream/now

            echo "=== current_playing table ==="
            sqlite3 /root/novastream/radio.db "SELECT * FROM current_playing;"
