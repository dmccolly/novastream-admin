name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
jobs:
  fix-next-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get context and fix broken next-track handler
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== LINES 1360-1510 OF SERVER BUNDLE ==="
            sed -n '1360,1510p' /root/novastream-admin/dist/index.js

            echo ""
            echo "=== NEXT-TRACK API RESPONSE BEFORE FIX ==="
            curl -s http://localhost:3006/api/stream/next-track
            echo ""
