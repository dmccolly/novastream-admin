name: Check Dropbox Env

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check Dropbox credentials and env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.184.12.217
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            echo "=== novastream-admin .env ==="
            cat /root/novastream-admin/.env 2>/dev/null || echo "NO .env FILE"

            echo "=== novastream .env ==="
            cat /root/novastream/.env 2>/dev/null || echo "NO .env FILE"

            echo "=== novastream-admin DB settings ==="
            sqlite3 /root/novastream-admin/radio.db "SELECT key, value FROM settings WHERE key LIKE 'dropbox%';" 2>&1

            echo "=== novastream DB settings ==="
            sqlite3 /root/novastream/radio.db "SELECT key, value FROM settings WHERE key LIKE 'dropbox%';" 2>&1

            echo "=== novastream-admin ecosystem.config ==="
            cat /root/novastream-admin/ecosystem.config.cjs 2>/dev/null

            echo "=== novastream PM2 env ==="
            pm2 env 7 2>&1 | grep -i dropbox || echo "No dropbox env in PM2"

            echo "=== Auth URL test from admin ==="
            curl -s http://localhost:3006/api/auth/dropbox/url 2>&1

            echo "=== Auth URL test from novastream ==="
            curl -s http://localhost:3001/api/auth/dropbox/url 2>&1
